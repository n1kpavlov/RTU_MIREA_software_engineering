version: '3.8'

services:
  forecast-api:
    build: .
    container_name: asu-forecast-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=asu_inventory
      - DB_USERNAME=${ASU_DB_USERNAME}
      - DB_PASSWORD=${ASU_DB_PASSWORD}
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
    networks:
      - asu-network
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: asu-postgres
    environment:
      - POSTGRES_DB=asu_inventory
      - POSTGRES_USER=${ASU_DB_USERNAME}
      - POSTGRES_PASSWORD=${ASU_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - asu-network
    restart: unless-stopped

networks:
  asu-network:
    driver: bridge

volumes:
  postgres-data: